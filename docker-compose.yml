version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: manumind-db
    restart: always
    environment:
      POSTGRES_USER: manumind
      POSTGRES_PASSWORD: manumind_password
      POSTGRES_DB: manumind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manumind -d manumind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: manumind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROVIDER: mock
      APP_ENV: production
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./ml/models_store:/app/ml/models_store
      - ./knowledge_base:/app/knowledge_base
      - ./reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manumind-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
